services:
  inventory-web:
    build: .
    container_name: inventory-web
    environment:
      FLASK_APP: app.py
      FLASK_DEBUG: "1"
      SECRET_KEY: 59357d15e32910dfe7ef482c
      INVENTORY_USERS: gugoadmin:Bodrum782!
      DATABASE_URL: mariadb+pymysql://inventory-user:da4ecff1fd4aa0da37a3e75c@mariadb:3306/inventory-db
    ports:
      - "5003:5000"
    depends_on:
      mariadb:
        condition: service_healthy
    command: >
      sh -c "flask --app app init-db &&
      flask --app app run --host=0.0.0.0 --port=5000"

  mariadb:
    image: mariadb:11.4
    container_name: inventory-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: a923d241d4c3be2948d42d37
      MARIADB_DATABASE: inventory-db
      MARIADB_USER: inventory-user
      MARIADB_PASSWORD: da4ecff1fd4aa0da37a3e75c
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:

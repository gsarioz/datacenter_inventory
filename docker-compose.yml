services:
  mariadb:
    image: mariadb:11.4
    container_name: inventory-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: datacenter_inventory
      MARIADB_USER: inventory
      MARIADB_PASSWORD: inventory
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
